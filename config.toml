# Midas settings. Everything is optional; the commented values are the defaults.

# Local API port (used by the daemon, the MCP bridge and the panel)
# port = 47821

# mlx-community Whisper model. Faster/smaller: "mlx-community/whisper-small-mlx"
# model = "mlx-community/whisper-large-v3-turbo"

# One language is forced; with several, Whisper picks among them for every sentence.
# languages = ["tr", "en"]

# Names and terms Whisper should spell correctly
# vocabulary = "Midas, Kubernetes, Jira, Alice, Bob"

# Silence (ms) that ends a sentence, and the longest chunk (s)
# silence_ms = 700
# max_segment_s = 20.0

# Live (unfinished) text in the panel while someone is talking
# partials = true

# Open the hidden panel
# overlay = true

# false: Claude replies only when you press "Answer".
# true: it also suggests replies by itself when it sees a question or request.
# auto_answer = false

# Default model and effort for the Claude that Midas.app runs in the background.
# Your choice from the panel's ⚙︎ button (saved in copilot.json) overrides these.
# claude_model = "opus"       # opus, sonnet, haiku
# claude_effort = "medium"    # low, medium, high, max

# How long one idle wait lasts (s). Keep it under the 1 h prompt-cache lifetime.
# idle_wait_s = 1500

# Who answers: "claude" (Claude Code with your Claude account) or "ollama" (a local model in
# Ollama: the meeting never leaves your Mac). The panel's ⚙︎ choice overrides this.
# provider = "claude"

# Ollama (https://ollama.com). Empty host: $OLLAMA_HOST, else http://127.0.0.1:11434.
# ollama_host = ""
# The model to answer with; empty picks the first one you have pulled. The panel's choice wins.
# ollama_model = "llama3.2"
# Context window for each answer (tokens); beyond it the oldest lines are left out.
# ollama_context = 8192
# How long Ollama keeps the model loaded between answers.
# ollama_keep_alive = "30m"

# Privacy
# At the start of each meeting, remind me to tell the others that I'm transcribing, with a
# message to paste into the meeting chat.
# consent_reminder = true
# My own wording for that message (empty: Midas's, in English and, with "tr" in languages, Turkish).
# notice_message = ""
# Only local models (Ollama) may answer; Claude can't read the meeting. Good for confidential
# meetings, or when rolling Midas out to a team.
# local_only = false
# Delete meeting logs in sessions/ older than this many days when Midas starts (0 keeps them).
# keep_sessions_days = 0

# A copilot reads only what was said in the last this-many minutes (your requests always go),
# so sound from before the meeting can't reach it. 0 lets it read the whole meeting.
# recent_minutes = 10

# What Midas listens to: "auto" (whichever app is in a call, that is, has its microphone on),
# "all" (everything the Mac plays) or one app's bundle ID such as "us.zoom.xos". With an app,
# only that app is heard, and only during its calls. The choice in the panel's ⚙︎ wins.
# listen_to = "auto"

# Speech after this many quiet minutes starts a new meeting: its own log and map, and the
# copilot starts over without the last one. 0 keeps one meeting per run.
# meeting_gap_minutes = 15

# Meeting map (the panel's Map tab): topics, questions put to you, your answers, decisions and
# action items, saved next to each meeting log. With a local model it follows the meeting by
# itself; Claude updates it only when you ask (Answer, Summary, Update map), unless auto_answer.
# map_live = true
# map_interval_s = 60
# The Claude model for the map: "sonnet", "haiku" or "opus".
# map_model = "sonnet"
# Action items not done and questions left open in your last meeting come over to the new map,
# if it was within this many days (0: off).
# carry_over_days = 14
