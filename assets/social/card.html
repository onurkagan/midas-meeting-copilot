<!doctype html>
<!-- The 1280×640 social preview card. scripts/build_site.sh renders it to docs/assets/og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midas social preview</title>
<style>
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../fonts/PlusJakartaSans-Variable.ttf") format("truetype");
    font-weight: 200 800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, "Helvetica Neue", sans-serif;
    color: #0e2a3b;
    background: linear-gradient(160deg, #eef6fa 0%, #d6eaf2 50%, #a9d2e3 100%);
    position: relative;
  }
  /* Two soft swells along the bottom: Tide. */
  .sea { position: absolute; left: 0; right: 0; bottom: 0; }
  .copy { position: absolute; left: 80px; top: 64px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 124px; height: 124px; filter: drop-shadow(0 16px 28px rgba(14, 60, 90, .25)); }
  .brand h1 { font-size: 90px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
  .tagline {
    margin-top: 30px; font-size: 44px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.12;
    background: linear-gradient(90deg, #1f6fb8 0%, #1e8a8a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lede { margin-top: 18px; font-size: 23px; line-height: 1.45; color: #44606f; max-width: 610px; }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 640px; }
  .chip {
    font-size: 18px; font-weight: 700; color: #136b62; padding: 8px 16px; border-radius: 999px;
    background: rgba(255, 255, 255, .7); border: 1px solid rgba(59, 179, 166, .35);
  }
  .url { position: absolute; left: 80px; bottom: 40px; font-size: 18px; color: #2c4b5c; letter-spacing: .2px; }
  .url b { color: #0e2a3b; font-weight: 700; }
  .panel {
    position: absolute; right: 78px; top: 40px; width: 376px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .7), 0 30px 70px rgba(14, 60, 90, .28);
  }
  .panel img { display: block; width: 100%; }
</style>
</head>
<body>
  <svg class="sea" width="1280" height="220" viewBox="0 0 1280 220" aria-hidden="true"><path d="M0 90 C220 40 420 140 640 90 C860 40 1060 140 1280 90 L1280 220 L0 220 Z" fill="rgba(255, 255, 255, .22)"/><path d="M0 150 C220 100 420 200 640 150 C860 100 1060 200 1280 150 L1280 220 L0 220 Z" fill="rgba(255, 255, 255, .2)"/></svg>
  <div class="copy">
    <div class="brand">
      <img src="../../docs/assets/icon-512.png" alt="">
      <h1>Midas</h1>
    </div>
    <p class="tagline">Open-source AI meeting<br>copilot for Mac</p>
    <p class="lede">Live, on-device transcripts of Zoom, Meet and Teams, with answers from Claude or a local model in a private panel.</p>
    <div class="chips">
      <span class="chip">No meeting bot</span>
      <span class="chip">Local Whisper</span>
      <span class="chip">Claude or Ollama</span>
      <span class="chip">Stays on your Mac</span>
    </div>
  </div>
  <p class="url">github.com/onurkagan/<b>midas-meeting-copilot</b></p>
  <div class="panel"><img src="../../docs/assets/panel.png" alt=""></div>
</body>
</html>
