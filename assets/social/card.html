<!doctype html>
<!-- The 1280×640 social preview card. scripts/build_site.sh renders it to docs/assets/og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midas social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #f4f7ff;
    background:
      radial-gradient(640px 420px at 210px 150px, rgba(76, 141, 255, .42), transparent 70%),
      radial-gradient(520px 520px at 1040px 520px, rgba(37, 99, 235, .30), transparent 70%),
      linear-gradient(160deg, #0b1d45 0%, #081430 55%, #050c1f 100%);
    position: relative;
  }
  /* Faint grid, like a blueprint of the panel. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(900px 600px at 30% 40%, #000 30%, transparent 80%);
  }
  .copy { position: absolute; left: 80px; top: 62px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 132px; height: 132px; filter: drop-shadow(0 18px 30px rgba(0, 20, 80, .55)); }
  .brand h1 { font-size: 92px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  .tagline {
    margin-top: 30px; font-size: 44px; font-weight: 700; letter-spacing: -.8px; line-height: 1.12;
    background: linear-gradient(90deg, #ffffff 0%, #b9d4ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lede { margin-top: 18px; font-size: 23px; line-height: 1.42; color: #aebcdc; max-width: 610px; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 640px; }
  .chip {
    font-size: 18px; font-weight: 600; color: #d8e6ff; padding: 8px 15px; border-radius: 999px;
    background: rgba(59, 130, 246, .16); border: 1px solid rgba(147, 190, 255, .28);
  }
  .url { position: absolute; left: 80px; bottom: 40px; font-size: 18px; color: #7f8fb3; letter-spacing: .2px; }
  .url b { color: #c9d8f5; font-weight: 600; }
  .panel {
    position: absolute; right: 78px; top: 40px; width: 376px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 30px 70px rgba(0, 8, 30, .75), 0 0 120px rgba(59,130,246,.25);
  }
  .panel img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../docs/assets/icon-512.png" alt="">
      <h1>Midas</h1>
    </div>
    <p class="tagline">Open-source AI meeting<br>copilot for Mac</p>
    <p class="lede">Live, on-device transcripts of Zoom, Meet and Teams. Answers from Claude in a panel screen sharing can't see.</p>
    <div class="chips">
      <span class="chip">No meeting bot</span>
      <span class="chip">Local Whisper</span>
      <span class="chip">Claude Code · MCP</span>
      <span class="chip">Hidden from screen share</span>
    </div>
  </div>
  <p class="url">github.com/onurkagan/<b>midas-meeting-copilot</b></p>
  <div class="panel"><img src="../../docs/assets/panel.png" alt=""></div>
</body>
</html>
